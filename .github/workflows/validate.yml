name: Validate current Windows source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build and run synthetic regression tests
        shell: pwsh
        run: |
          dotnet build HermesDevDesk.sln -c Release --nologo -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $tests = Join-Path $PWD 'tests/Hermes.Tests/bin/Release/net10.0/Hermes.Tests.exe'
          Push-Location $env:RUNNER_TEMP
          try { & $tests; if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' } } finally { Pop-Location }
      - name: Check actual engine model routing
        shell: pwsh
        run: |
          ./scripts/fetch-engine.ps1
          $engine = Get-ChildItem vendor -Recurse -Filter codex.exe | Select-Object -First 1
          & ./tests/Hermes.Tests/bin/Release/net10.0/Hermes.Tests.exe --model-connections-engine --root (Join-Path $env:RUNNER_TEMP 'model-routing') --codex $engine.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Model routing test failed' }
      - name: Check WPF model management and long conversation
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'src/Hermes.Desktop/bin/Release/net10.0-windows/HermesDevDesk.exe'
          foreach ($test in @('simple-settings','conversation-performance')) {
            $data = Join-Path $env:RUNNER_TEMP $test
            $process = Start-Process $app -ArgumentList @("--$test-smoke", '--data-dir', ('"'+$data+'"')) -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(60000)) { throw "$test timed out" }
            if ($process.ExitCode -ne 0) { Get-ChildItem $data -Filter '*error.txt' | Get-Content; throw "$test failed" }
          }
