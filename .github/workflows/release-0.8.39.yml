name: Publish 0.8.39 Windows release
on:
  push:
    tags: [v0.8.39]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'jhham0322/HermesDevDesk' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: v0.8.39
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Fetch integrity-pinned official engine
        shell: pwsh
        run: ./scripts/fetch-engine.ps1
      - name: Build tagged source and Windows packages
        shell: pwsh
        run: ./scripts/build.ps1 -DotnetPath (Get-Command dotnet).Source -OutputDirectory artifacts/release-0.8.39
      - name: Run regression and current-request engine checks
        shell: pwsh
        run: |
          dotnet build tests/Hermes.Tests/Hermes.Tests.csproj -c Release --nologo -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          $tests = Join-Path $PWD 'tests/Hermes.Tests/bin/Release/net10.0/Hermes.Tests.exe'
          $engine = (Get-ChildItem vendor -Recurse -Filter codex.exe | Select-Object -First 1).FullName
          $report = Join-Path $env:RUNNER_TEMP 'current-request-engine.json'
          Push-Location $env:RUNNER_TEMP
          try {
            & $tests
            if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
            & $tests --continuation-engine --codex $engine
            if ($LASTEXITCODE -ne 0) { throw 'Persistent queue, uncapped tools and automatic restart check failed' }
            & $tests --budget-resume-engine --codex $engine
            if ($LASTEXITCODE -ne 0) { throw 'Budget restart engine check failed' }
            & $tests --task-loop-engine --codex $engine
            if ($LASTEXITCODE -ne 0) { throw 'Completion loop and recovery engine checks failed' }
            & $tests --simple-gateway-engine-smoke --codex $engine --report $report
            if ($LASTEXITCODE -ne 0) { throw 'Current-request engine checks failed' }
          } finally { Pop-Location }
          Get-Content $report
      - name: Verify embedded installer payload and public files
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/release-0.8.39'
          $report = Join-Path $root 'installer-verify.txt'
          $check = Start-Process -FilePath (Join-Path $root 'HermesDevDesk-0.8.39-win-x64-Setup.exe') -ArgumentList @('/verify',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Installer verification timed out' }
          if ($check.ExitCode -ne 0) { throw 'Installer verification failed' }
          python scripts/verify-public-release.py --app (Join-Path $root 'app') --source $PWD
          if ($LASTEXITCODE -ne 0) { throw 'Public payload verification failed' }
          Get-Content $report
      - name: Verify Office add-in automation adapters
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/release-0.8.39'
          $report = Join-Path $root 'office-addin-report.json'
          $check = Start-Process -FilePath (Join-Path $root 'app/HermesDevDesk.exe') -ArgumentList @('--office-addin-self-test',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Office adapter checks timed out' }
          if ($check.ExitCode -ne 0) { Get-Content $report; throw 'Office adapter checks failed' }
          Get-Content $report
      - name: Verify installed process and error RAG controls
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.39/app/HermesDevDesk.exe'
          $data = Join-Path $env:RUNNER_TEMP 'process-panel'
          $check = Start-Process -FilePath $app -ArgumentList @('--process-panel-smoke','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Process UI verification timed out' }
          if ($check.ExitCode -ne 0) { Get-Content (Join-Path $data 'process-panel-error.txt'); throw 'Process UI verification failed' }
          Get-Content (Join-Path $data 'process-panel-report.json')
      - name: Verify shared browser leases and background rendering
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.39/app/HermesDevDesk.exe'
          $data = Join-Path $env:RUNNER_TEMP 'shared-browser'
          $check = Start-Process -FilePath $app -ArgumentList @('--browser-experience-smoke','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Shared browser UI verification timed out' }
          if ($check.ExitCode -ne 0) { Get-Content (Join-Path $data 'browser-experience-error.txt'); throw 'Shared browser UI verification failed' }
          Get-Content (Join-Path $data 'browser-experience-report.json')
      - name: Verify provenance, report visibility, budget and restart UI
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.39/app/HermesDevDesk.exe'
          foreach ($mode in @('--continuation-ui-smoke','--tool-card-visibility-smoke','--tool-card-restart-smoke','--conversation-title-smoke','--command-details-smoke','--execution-ui-smoke','--progress-visibility-smoke','--progress-restart-smoke','--conversation-performance-smoke')) {
            $profile = if ($mode -in @('--progress-visibility-smoke','--progress-restart-smoke')) { 'visibility' } elseif ($mode -in @('--tool-card-visibility-smoke','--tool-card-restart-smoke')) { 'tool-cards' } else { $mode.TrimStart('-') }
            $data = Join-Path $env:RUNNER_TEMP $profile
            $check = Start-Process -FilePath $app -ArgumentList @($mode,'--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
            if (-not $check.WaitForExit(60000)) { throw 'Provenance UI timed out' }
            if ($check.ExitCode -ne 0) { throw "Provenance UI failed: $mode" }
          }
      - name: Verify forced clean reinstallation with real file locks
        shell: pwsh
        run: |
          ./scripts/verify-force-reinstall.ps1 -ReleaseDirectory artifacts/release-0.8.39 -ExpectedVersion 0.8.39
          if ($LASTEXITCODE -ne 0) { throw 'Forced reinstall verification failed' }
          $root = Join-Path $PWD 'artifacts/release-0.8.39'
          $report = Join-Path $root 'cleanup-verify.txt'
          $check = Start-Process -FilePath (Join-Path $root 'HermesDevDesk-0.8.39-win-x64-Setup.exe') -ArgumentList @('/cleanup-test',('"'+(Join-Path $root 'cleanup-fixture')+'"'),('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Legacy cleanup verification timed out' }
          if ($check.ExitCode -ne 0) { throw 'Legacy cleanup verification failed' }
          Get-Content $report
      - name: Publish verified Windows installer and portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = 'jhham0322/HermesDevDesk'
          gh release view v0.8.39 --repo $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; existing assets will not be overwritten' }
          gh release create v0.8.39 --repo $repo --verify-tag --title 'HermesDevDesk 0.8.39 (experimental)' --notes-file RELEASE-NOTES.md artifacts/release-0.8.39/HermesDevDesk-0.8.39-win-x64-Setup.exe artifacts/release-0.8.39/HermesDevDesk-0.8.39-win-x64-Portable.zip
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view v0.8.39 --repo $repo --json url,tagName,assets
