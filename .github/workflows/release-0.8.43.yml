name: Publish 0.8.43 OAuth preview with disclosed limitations
on:
  push:
    tags: [v0.8.43]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'jhham0322/HermesDevDesk' && github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: v0.8.43
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Fetch integrity-pinned official engine
        shell: pwsh
        run: ./scripts/fetch-engine.ps1
      - name: Build tagged source and Windows packages
        shell: pwsh
        run: ./scripts/build.ps1 -DotnetPath (Get-Command dotnet).Source -OutputDirectory artifacts/release-0.8.43
      - name: Retain regression and disclose failed continuation gate
        shell: pwsh
        run: |
          dotnet build tests/Hermes.Tests/Hermes.Tests.csproj -c Release --nologo -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          $tests = Join-Path $PWD 'tests/Hermes.Tests/bin/Release/net10.0/Hermes.Tests.exe'
          Push-Location $env:RUNNER_TEMP
          try { & $tests; if ($LASTEXITCODE -ne 0) { throw 'Regression failed' } } finally { Pop-Location }
          Write-Warning 'Continuation integration gate failed in run 41955509592. Publication explicitly approved with this limitation; it is not a passed test.'
      - name: Verify packaged command input behavior
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          $fixture = Join-Path $PWD 'tests/Hermes.Tests/bin/Release/net10.0/Hermes.Tests.exe'
          $data = Join-Path $env:RUNNER_TEMP 'command-input-package'
          $check = Start-Process $app -ArgumentList @('--command-input-smoke','--data-dir',('"'+$data+'"'),'--fixture-exe',('"'+$fixture+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Command input check timed out' }
          if ($check.ExitCode -ne 0) { throw 'Command input check failed' }
          Get-Content (Join-Path $data 'command-input-report.json')
      - name: Verify OAuth and existing simple company settings UI
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          foreach ($mode in @('--chatgpt-plan-ui-smoke','--simple-settings-smoke')) {
            $data = Join-Path $env:RUNNER_TEMP $mode.TrimStart('-')
            $check = Start-Process $app -ArgumentList @($mode,'--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
            if (-not $check.WaitForExit(60000)) { throw 'UI verification timed out' }
            if ($check.ExitCode -ne 0) { throw "UI verification failed: $mode" }
            Get-ChildItem $data -Filter '*report.json' | ForEach-Object { Get-Content $_.FullName }
          }
      - name: Verify embedded installer payload and public files
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/release-0.8.43'
          $report = Join-Path $root 'installer-verify.txt'
          $check = Start-Process -FilePath (Join-Path $root 'HermesDevDesk-0.8.43-win-x64-Setup.exe') -ArgumentList @('/verify',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Installer verification timed out' }
          if ($check.ExitCode -ne 0) { throw 'Installer verification failed' }
          python scripts/verify-public-release.py --app (Join-Path $root 'app') --source $PWD
          if ($LASTEXITCODE -ne 0) { throw 'Public payload verification failed' }
          Get-Content $report
      - name: Verify Office add-in automation adapters
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/release-0.8.43'
          $report = Join-Path $root 'office-addin-report.json'
          $check = Start-Process -FilePath (Join-Path $root 'app/HermesDevDesk.exe') -ArgumentList @('--office-addin-self-test',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Office adapter checks timed out' }
          if ($check.ExitCode -ne 0) { Get-Content $report; throw 'Office adapter checks failed' }
          Get-Content $report
      - name: Verify installed process and error RAG controls
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          $data = Join-Path $env:RUNNER_TEMP 'process-panel'
          $check = Start-Process -FilePath $app -ArgumentList @('--process-panel-smoke','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Process UI verification timed out' }
          if ($check.ExitCode -ne 0) { Get-Content (Join-Path $data 'process-panel-error.txt'); throw 'Process UI verification failed' }
          Get-Content (Join-Path $data 'process-panel-report.json')
      - name: Verify shared browser leases and background rendering
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          $data = Join-Path $env:RUNNER_TEMP 'shared-browser'
          $check = Start-Process -FilePath $app -ArgumentList @('--browser-experience-smoke','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Shared browser UI verification timed out' }
          if ($check.ExitCode -ne 0) { Get-Content (Join-Path $data 'browser-experience-error.txt'); throw 'Shared browser UI verification failed' }
          Get-Content (Join-Path $data 'browser-experience-report.json')
      - name: Verify provenance, report visibility, budget and restart UI
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          foreach ($mode in @('--continuation-ui-smoke','--tool-card-visibility-smoke','--tool-card-restart-smoke','--conversation-title-smoke','--command-details-smoke','--execution-ui-smoke','--progress-visibility-smoke','--progress-restart-smoke','--conversation-performance-smoke')) {
            $profile = if ($mode -in @('--progress-visibility-smoke','--progress-restart-smoke')) { 'visibility' } elseif ($mode -in @('--tool-card-visibility-smoke','--tool-card-restart-smoke')) { 'tool-cards' } else { $mode.TrimStart('-') }
            $data = Join-Path $env:RUNNER_TEMP $profile
            $check = Start-Process -FilePath $app -ArgumentList @($mode,'--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
            if (-not $check.WaitForExit(60000)) { throw 'Provenance UI timed out' }
            if ($check.ExitCode -ne 0) { throw "Provenance UI failed: $mode" }
          }
      - name: Verify forced clean reinstallation with real file locks
        shell: pwsh
        run: |
          ./scripts/verify-force-reinstall.ps1 -ReleaseDirectory artifacts/release-0.8.43 -ExpectedVersion 0.8.43
          if ($LASTEXITCODE -ne 0) { throw 'Forced reinstall verification failed' }
          $root = Join-Path $PWD 'artifacts/release-0.8.43'
          $report = Join-Path $root 'cleanup-verify.txt'
          $check = Start-Process -FilePath (Join-Path $root 'HermesDevDesk-0.8.43-win-x64-Setup.exe') -ArgumentList @('/cleanup-test',('"'+(Join-Path $root 'cleanup-fixture')+'"'),('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Legacy cleanup verification timed out' }
          if ($check.ExitCode -ne 0) { throw 'Legacy cleanup verification failed' }
          Get-Content $report
      - name: Record known company 404 UI diagnostic without changing assertion
        id: company404
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          $data = Join-Path $env:RUNNER_TEMP 'known-company-404'
          $check = Start-Process $app -ArgumentList @('--provider-settings-smoke','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Known company UI diagnostic timed out' }
          if ($check.ExitCode -ne 0) { Get-Content (Join-Path $data 'provider-settings-error.txt'); throw 'Known company 404 UI assertion failed; explicitly disclosed preview limitation' }
      - name: Disclose diagnostic outcome
        shell: pwsh
        run: Write-Warning 'Company 404 diagnostic outcome is ${{ steps.company404.outcome }}; a failed diagnostic is not reported as passed. Real OAuth account/model E2E and prior continuation reliability remain unverified.'
      - name: Record original shell UI diagnostic with baseline limitation
        id: shellbaseline
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'artifacts/release-0.8.43/app/HermesDevDesk.exe'
          $data = Join-Path $env:RUNNER_TEMP 'known-shell-baseline'
          $check = Start-Process $app -ArgumentList @('--ui-smoke','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(60000)) { throw 'Original shell diagnostic timeout' }
          if ($check.ExitCode -ne 0) { Get-Content (Join-Path $data 'ui-smoke-error.txt'); throw 'Original shell expanded-default assertion failed; disclosed and reproduced on baseline 0.8.42' }
      - name: Verify actual isolated-installed OAuth and company settings UI
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/release-0.8.43'
          $installed = (Get-Content (Join-Path $root 'force-reinstall-report.json') -Raw | ConvertFrom-Json).installPath
          foreach ($mode in @('--chatgpt-plan-ui-smoke','--simple-settings-smoke')) {
            $data = Join-Path $env:RUNNER_TEMP ('installed-' + $mode.TrimStart('-'))
            $check = Start-Process (Join-Path $installed 'HermesDevDesk.exe') -ArgumentList @($mode,'--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
            if (-not $check.WaitForExit(60000)) { throw 'Installed application check timeout' }
            if ($check.ExitCode -ne 0) { throw "Installed application check failed: $mode" }
            Get-ChildItem $data -Filter '*report.json' | ForEach-Object { Get-Content $_.FullName }
          }
      - name: Publish verified Windows installer and portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = 'jhham0322/HermesDevDesk'
          gh release view v0.8.43 --repo $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; existing assets will not be overwritten' }
          gh release create v0.8.43 --repo $repo --verify-tag --title 'HermesDevDesk 0.8.43 (OAuth preview)' --prerelease --notes-file RELEASE-NOTES.md artifacts/release-0.8.43/HermesDevDesk-0.8.43-win-x64-Setup.exe artifacts/release-0.8.43/HermesDevDesk-0.8.43-win-x64-Portable.zip
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view v0.8.43 --repo $repo --json url,tagName,assets
